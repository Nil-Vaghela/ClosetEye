name: CI

on:
  push:
    branches: [main, "DR-*", "release/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: drape
          POSTGRES_PASSWORD: drape
          POSTGRES_DB: drape_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U drape" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://drape:drape@localhost:5432/drape_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest-cov
      - run: ruff check .
      - run: pytest -q --cov=app/services --cov=app/api --cov-report=term-missing:skip-covered

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/ClosetEyeFlutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
