# Local development only. Production runs backend/Dockerfile on a host with managed Postgres.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: closeteye
      POSTGRES_PASSWORD: closeteye
      POSTGRES_DB: closeteye
    ports:
      - "127.0.0.1:5432:5432"   # this machine only
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "8000:8000"             # reachable from your phone on the LAN for dev
    env_file:
      - ./backend/.env
    depends_on:
      - db
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      # Firebase Admin key: mounted read-only, never baked into an image (see .dockerignore).
      # Point FIREBASE_SERVICE_ACCOUNT_PATH in backend/.env at /app/secrets/firebase-admin.json
      - ./backend/secrets:/app/secrets:ro
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
